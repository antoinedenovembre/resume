name: Release Resume

on:
  workflow_run:
    workflows: ["Compile Resume"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request' }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IS_MAIN_LATEST: ${{ github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download all PDF artifacts
        uses: actions/download-artifact@v4
        with:
          # one folder per artifact: build/pdf-<style>_<variant>/resume_<variant>.pdf
          pattern: pdf-*
          path: build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release files
        run: |
          # One zip per style, each holding the 4 variants (photo/no photo x EN/FR)
          for style in default tech sidebar; do
            mkdir -p "zip/$style"
            for v in with-image-en no-image-en with-image-fr no-image-fr; do
              cp "build/pdf-${style}_${v//-/_}/resume_${v//-/_}.pdf" "zip/$style/resume-$style-$v.pdf"
            done
            (cd "zip/$style" && zip -q "../../resume-$style.zip" *.pdf)
          done
          # Standalone PDFs of the default style, kept for the README / site links
          cp zip/default/resume-default-with-image-en.pdf resume-with-image-en.pdf
          cp zip/default/resume-default-no-image-en.pdf resume-no-image-en.pdf
          cp zip/default/resume-default-with-image-fr.pdf resume-with-image-fr.pdf
          cp zip/default/resume-default-no-image-fr.pdf resume-no-image-fr.pdf
          cp zip/default/resume-default-with-image-en.pdf resume_en.pdf
          cp zip/default/resume-default-with-image-fr.pdf resume_fr.pdf

      - name: Archive current "latest" as a dated version
        if: env.IS_MAIN_LATEST == 'true'
        continue-on-error: true
        run: |
          if gh release view latest >/dev/null 2>&1; then
            PREV_SHA=$(gh release view latest --json targetCommitish -q .targetCommitish)
            PREV_DATE=$(gh release view latest --json createdAt -q .createdAt)
            # Tag as dd.mm.yyyy; add -2, -3... if that day already has an archive
            BASE="$(date -u -d "$PREV_DATE" +%d.%m.%Y)"
            VERSION="$BASE"
            N=2
            while gh release view "$VERSION" >/dev/null 2>&1; do
              VERSION="$BASE-$N"
              N=$((N + 1))
            done
            mkdir -p archive
            gh release download latest --dir archive --clobber
            gh release create "$VERSION" \
              --target "$PREV_SHA" \
              --title "Resume $VERSION" \
              --notes "Automatic dated snapshot of the resume that was previously published as \"latest\" (commit $PREV_SHA)." \
              archive/*
          else
            echo "No existing 'latest' release found — nothing to archive."
          fi

      - name: Delete existing latest release
        if: env.IS_MAIN_LATEST == 'true'
        continue-on-error: true
        run: |
          gh release delete latest --yes || true
          git push --delete origin latest || true

      - name: Create latest release
        if: env.IS_MAIN_LATEST == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: "Latest resume"
          body: |
            Latest compiled resume PDFs from commit ${{ github.event.workflow_run.head_sha }}

            **Files included:**
            - `resume-default.zip` - Default style, all 4 variants (with/without photo, EN/FR)
            - `resume-tech.zip` - Tech style, all 4 variants (with/without photo, EN/FR)
            - `resume-sidebar.zip` - Sidebar style, all 4 variants (with/without photo, EN/FR)
            - `resume-with-image-en.pdf` - Default style with headshot (English)
            - `resume-no-image-en.pdf` - Default style without headshot (English)
            - `resume-with-image-fr.pdf` - Default style with headshot (French)
            - `resume-no-image-fr.pdf` - Default style without headshot (French)
            - `resume_en.pdf` - Default English resume (with photo)
            - `resume_fr.pdf` - Default French resume (with photo)

            **Build date:** ${{ github.event.workflow_run.head_commit.timestamp }}
          files: resume-default.zip,resume-tech.zip,resume-sidebar.zip,resume-with-image-en.pdf,resume-no-image-en.pdf,resume-with-image-fr.pdf,resume-no-image-fr.pdf,resume_en.pdf,resume_fr.pdf
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
